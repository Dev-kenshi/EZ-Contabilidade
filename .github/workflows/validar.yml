name: Validar dados e links
on:
  push:
  pull_request:
  schedule:
    - cron: '17 11 * * 1'
  workflow_dispatch:
jobs:
  dados:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python3 tools/validar_dados.py
      - run: python3 src/build.py
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node tools/validar_links.mjs
